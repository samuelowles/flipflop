name: CI

on:
  pull_request:
  # Manual re-run. PR events are not always delivered — during the beta review
  # of 2026-08-06, CI fired for six consecutive PRs and then silently stopped
  # for the next three, with the workflow active, Actions enabled and the repo
  # public (so minutes are free). Closing and reopening a PR did not re-trigger
  # it either. Without a dispatch trigger there is NO way to ask for a run, and
  # a PR that cannot be checked cannot be merged with confidence.
  workflow_dispatch:
  # Master pushes are gated too: squash-merges land without re-running the PR
  # checks against the merged tree, and deploys are Cloudflare's Git
  # integration (Workers Builds, production branch = master), which deploys
  # regardless of test state — a red run here is the alarm that a bad commit
  # shipped.
  push:
    branches: [master]

jobs:
  ci:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22 LTS — wrangler ≥4 (dev/deploy/dry-run) requires Node ≥22.
          node-version: "22"
          cache: npm
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Env-vars documented (operator-provisioning guard)
        # Fails when the Worker reads an env value the runbook never tells the
        # operator to set. SENT_WEBHOOK_SECRET was missing for exactly this
        # reason and would have 500-ed every inbound webhook on a fresh deploy.
        run: npm run check:env-docs

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest)
        # TODO(phase-2): re-enable --coverage once @cloudflare/vitest-pool-workers
        # supports @vitest/coverage-v8 in workerd (tracked in #135).
        run: npm test

      # Issue #285. The unit suite mocks every binding, so it cannot see an FK
      # violation, a rejected payload shape or a broken queue consumer — the
      # exact defects that broke the last live run. This suite applies every
      # migration to a real (miniflare-local) D1 and runs the real consumers,
      # stubbing only outbound HTTP. Nothing here touches remote D1.
      - name: E2E tests (real D1, real queue consumers)
        run: npm run test:e2e

      # Issue #242 — deploy dry-run as a CI gate so binding/entrypoint breakage
      # (e.g. a Durable Object declared in wrangler.toml but not exported from
      # src/index.ts — the RateLimiter blocker that left master undeployable)
      # can never merge silently again. Bundles the Worker without deploying.
      - name: Wrangler deploy dry-run (binding/entrypoint guard)
        run: npx wrangler deploy --dry-run --outdir /tmp/dryrun

      # Coverage upload is disabled until --coverage is re-enabled above.
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: workers/coverage/
          if-no-files-found: ignore

  # Issue #285. The control plane and the documentation are checked here rather
  # than only inside engine/gate.mjs, so a change that reaches master by any
  # route — a hand-merged PR, a direct push — is still held to them. stdlib
  # only: no npm install, no Python, seconds not minutes.
  engine:
    name: control plane + docs drift + acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # drift.mjs replays every migration and diffs derived inventories
          # against the docs; gate.mjs compares its own blob id against the
          # trunk. Both need real history, not a depth-1 clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Covers the issue selector and the dependency parser. A silent wrong
      # answer there does not crash — it starts blocked or wrong work.
      - name: Control-plane tests
        run: node --test engine/engine.test.mjs

      # Re-derives routes, tables, cron, flags, env vars, outbound hosts and
      # PRD-claim coverage from source and fails when the docs disagree.
      - name: Documentation drift
        run: node engine/drift.mjs

      # Every numbered PRD section must have a manifest entry. With no staging
      # base URL configured every probe skips and the run reports the coverage
      # gap; it never touches production (run.mjs refuses production hosts
      # outright, and CI sets no base URL).
      - name: Acceptance probes
        run: node acceptance/run.mjs

  python-eval:
    name: parser pytest + eval harness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          pip install -r python/requirements.txt
          pip install -r python/requirements-dev.txt

      - name: Run parser unit tests (pytest)
        run: pytest python/ -q

      - name: Run parse-eval harness (golden fixtures)
        # Runs every committed PDF in python/fixtures/ through the parser and
        # compares to its sibling .expected.json. Prints a per-retailer pass
        # rate + average confidence table. Exits non-zero on any mismatch
        # (fails the PR). See scripts/eval_parser.py for the comparison contract.
        run: python scripts/eval_parser.py

